worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone "test" zone=health_limit:2m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;

    map $http_x_api_key $missing_api_key {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    map $http_x_origin $missing_origin {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    server {
        listen       80;
        server_name  localhost;

        limit_req_status 429;

        location /check {
            add_header Content-Type text/plain;
            return 200 "Getaway OK";
        }

        # /core/api/v1/health/ (sin autenticación)
        location /core/api/v1/health/ {
            proxy_pass http://core-service:8000/api/v1/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /core/api/v1/ (con autenticación)
        location /core/ {
            if ($missing_api_key) {
                return 401 "x-api-key is required";
            }
            if ($missing_origin) {
                return 401 "x-origin is required";
            }
            
            proxy_pass http://core-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/api/v1/ {
            proxy_pass http://users:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/api/v2/ {
            if ($missing_api_key) {
                return 401 "x-api-key is required";
            }
            if ($missing_origin) {
                return 401 "x-origin is required";
            }

            proxy_pass http://users:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            add_header Content-Type text/plain;
            return 404 'Not Found\n';
        }

    }
}
