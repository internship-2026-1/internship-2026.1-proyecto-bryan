worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include /etc/nginx/mime.types;
    default_type  application/octet-stream;

    limit_req_zone "test" zone=health_limit:2m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=3r/s;

    map $http_x_api_key $missing_api_key {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    map $http_x_origin $missing_origin {
        "" 1;
        "~^\s*$" 1;
        default 0;
    }

    server {
        listen       80;
        server_name  localhost;

        limit_req_status 429;

        location /check {
            add_header Content-Type text/plain;
            return 200 "Getaway OK";
        }

        # /core/api/v1/health/ (sin autenticación)
        location /core/api/v1/health/ {
            add_header 'Access-Control-Allow-Origin' '*' always;
            proxy_pass http://svc-core:8000/api/v1/health/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /core/internal/ (sin autenticación — llamadas internas entre servicios)
        location /core/internal/ {
            proxy_pass http://svc-core:8000/internal/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # /core/api/v1/ y /core/admin/ (con autenticación: x-api-key + x-origin)
        location /core/ {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Api-Key, X-Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            if ($missing_api_key) {
                return 401 "x-api-key is required";
            }
            if ($missing_origin) {
                return 401 "x-origin is required";
            }
            
            proxy_pass http://svc-core:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/api/v1/ {
            add_header 'Access-Control-Allow-Origin' $http_origin always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, X-Api-Key, X-Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://svc-users:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /user/api/v2/ {
            if ($missing_api_key) {
                return 401 "x-api-key is required";
            }
            if ($missing_origin) {
                return 401 "x-origin is required";
            }

            proxy_pass http://svc-users:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            add_header Content-Type text/plain;
            return 404 'Not Found\n';
        }

    }
}
